<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - EU RH</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #3538b8, #7aa6d1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
            color: #0f172a;
        }

        p {
            color: #475569;
            margin-bottom: 20px;
        }

        .erro {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #3b3bb3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 16px;
            color: #d96f32;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Redefinir senha</h1>
        <p>Digite sua nova senha.</p>

        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <label for="senha">Nova senha</label>
            <input type="password" name="senha" placeholder="Digite a nova senha" required>

            <label for="confirmar_senha">Confirmar senha</label>
            <input type="password" name="confirmar_senha" placeholder="Confirme a nova senha" required>

            <button type="submit">Salvar nova senha</button>
        </form>

        <a href="{{ url_for('pagina_login') }}">← Voltar para login</a>
    </div>
</body>
</html>
