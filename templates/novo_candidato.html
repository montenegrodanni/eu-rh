<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Candidato - EU RH</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-color: #f3f4f6;
      color: #1f2937;
    }

    .container{
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    .box{
      background-color: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }

    h1{
      margin-bottom: 10px;
    }

    p{
      color: #6b7280;
      margin-bottom: 25px;
    }

    .grupo{
      margin-bottom: 18px;
    }

    .grupo label{
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .grupo input,
    .grupo textarea{
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .grupo textarea{
      min-height: 120px;
    }

    .btn{
      width: 100%;
      border: none;
      background-color: rgb(50, 50, 158);
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover{
      background-color: rgb(40, 40, 130);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="box">
    <h1>Novo candidato</h1>
    <p>Preencha os dados do candidato para esta vaga.</p>

    <form action="/vaga/{{ vaga_id }}/novo-candidato" method="post">
      <div class="grupo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="grupo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="grupo">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone">
      </div>

      <div class="grupo">
        <label for="curriculo">Currículo / Observações</label>
        <textarea id="curriculo" name="curriculo"></textarea>
      </div>

      <button type="submit" class="btn">Salvar candidato</button>
    </form>
  </div>
</div>

</body>
</html>
