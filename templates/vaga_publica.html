<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ vaga[2] }} - EU RH</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-color: #f3f4f6;
      color: #1f2937;
    }

    header{
      background-color: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 50px;
    }

    .topo{
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo{
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: bold;
    }

    .logo-box{
      background-color: rgb(206, 98, 47);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container{
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .box{
      background-color: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }

    h1{
      font-size: 36px;
      margin-bottom: 20px;
      color: #111827;
    }

    .info{
      margin-bottom: 12px;
      color: #374151;
      font-size: 18px;
    }

    .descricao{
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #d1d5db;
      line-height: 1.6;
      color: #4b5563;
      font-size: 17px;
    }
    .container {
    position: relative; /* MUITO IMPORTANTE */
}
.btn-candidatar {
    display: inline-block;
    background: #3538b8;
    color: white;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 14px;
    border: none;
}

.btn-candidatar:hover {
    opacity: 0.95;
}


.btn-voltar {
    position: absolute;
    top: 20px;
    right: 35px;
    
}

  </style>
</head>
<body>

<header>
  <div class="topo">
    <div class="logo">
      <div class="logo-box">EU</div>
      <span>EU RH</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="box">
    
    <a href="{{ url_for('listar_vagas') }}" class="btn-candidatar btn-voltar">
    ← Voltar
</a>

    <h1>{{ vaga[2] }}</h1>

    <p class="info"><strong>Setor:</strong> {{ vaga[4] }}</p>
    <p class="info"><strong>Salário:</strong> R$ {{ vaga[5] }}</p>
    <p class="info"><strong>Tipo:</strong> {{ vaga[6] }}</p>
    <p class="info"><strong>Local:</strong> {{ vaga[7] }}</p>

    

    <div class="descricao">
  {{ vaga[3] }}
</div>

<br><br>

    <a href="{{ url_for('candidatar', id=vaga[0]) }}" class="btn-candidatar">
    Candidatar-se
</a>
  </div>
</div>

</body>
</html>
