<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Vagas - EU RH</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      color: #1f2937;
    }

    .container{
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .topo{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .titulo{
      font-size: 28px;
      font-weight: bold;
    }

    .btn-voltar{
      text-decoration: none;
      background: white;
      color: #1f2937;
      border: 1px solid #d1d5db;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .lista-vagas{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card{
      background: white;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .info h3{
      margin: 0 0 6px 0;
    }

    .info p{
      margin: 4px 0;
      color: #6b7280;
    }

    .acoes{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-sec{
      background: white;
      border: 1px solid #d1d5db;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: #111827;
      font-weight: bold;
    }

    .btn-editar{
      background: rgb(50, 50, 158);
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn-excluir{
      background: rgb(206, 98, 47);
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .sem-vagas{
      background: white;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      color: #6b7280;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="topo">
    <h2 class="titulo">Minhas vagas</h2>
    <a href="{{ url_for('dashboard') }}" class="btn-voltar">Voltar</a>
  </div>

  {% if vagas %}
    <div class="lista-vagas">
      {% for vaga in vagas %}
      <div class="card">
        <div class="info">
          <h3>{{ vaga['titulo'] }}</h3>
          <p>Salário: R$ {{ vaga['salario'] }}</p>
          <p>Localização: {{ vaga['localizacao'] }}</p>
        </div>

        <div class="acoes">
          <a href="{{ url_for('ver_candidatos', vaga_id=vaga['id']) }}" class="btn-sec">Ver candidatos</a>
          <a href="{{ url_for('ver_vaga_publica', id=vaga['id']) }}" class="btn-sec">Ver vaga</a>
          <a href="{{ url_for('pagina_editar_vaga', id=vaga['id']) }}" class="btn-editar">Editar</a>
          <a href="{{ url_for('excluir_vaga', id=vaga['id']) }}"
             class="btn-excluir"
             onclick="return confirm('Tem certeza que deseja excluir esta vaga?')">
             Excluir
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="sem-vagas">
      Nenhuma vaga cadastrada para esta empresa.
    </div>
  {% endif %}
</div>

</body>
</html>
